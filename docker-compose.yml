services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_monitor_db
    environment:
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: smart_pass
      POSTGRES_DB: smart_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smart_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-monitor-backend
    container_name: smart_monitor_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://smart_user:smart_pass@postgres:5432/smart_monitor
      DATABASE_SYNC_URL: postgresql://smart_user:smart_pass@postgres:5432/smart_monitor
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      # Télémétrie réelle depuis la station physique (via ngrok)
      SIMULATION_MODE: "false"
      CSV_DATA_PATH: /app/csv_data
      CORS_ORIGINS: "*"
      GREENHOUSE_TELEMETRY_URL: https://bulgur-stricken-ambulance.ngrok-free.dev/api/telemetry/latest
      TELEMETRY_POLL_SECONDS: 20
    volumes:
      - ./backend:/app
      - csv_data:/app/csv_data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - smart_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: smart-monitor-frontend
    container_name: smart_monitor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smart_net
    restart: unless-stopped

volumes:
  postgres_data:
  csv_data:

networks:
  smart_net:
    driver: bridge
